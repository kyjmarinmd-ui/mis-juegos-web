<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obstacle Course: WH Questions in Simple Past</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&display=swap');

  :root {
    --cinder: #d94e2b;
    --cinder-dark: #a33216;
    --lane: #fceade;
    --sky-top: #74c0fc;
    --sky-bottom: #a5d8ff;
    --grass: #40c057;
    --grass-dark: #2b8a3e;
    --ink: #1f2937;
    --gold: #fcc419;
    --gold-dark: #f59f00;
    --white: #ffffff;
    --bad: #fa5252;
    --good: #40c057;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    /* Fondo animado */
    background: linear-gradient(-45deg, #74c0fc, #a5d8ff, #63e6be, #8ce99a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 16px 40px;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Nubes animadas */
  .clouds {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 180px;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50px;
    animation: moveClouds linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 50%;
  }
  .cloud1 { width: 120px; height: 40px; top: 20px; animation-duration: 25s; }
  .cloud1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
  .cloud1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

  .cloud2 { width: 180px; height: 50px; top: 70px; animation-duration: 38s; animation-delay: -12s; }
  .cloud2::before { width: 70px; height: 70px; top: -30px; left: 25px; }
  .cloud2::after { width: 50px; height: 50px; top: -20px; left: 85px; }

  @keyframes moveClouds {
    from { left: -200px; }
    to { left: 100%; }
  }

  .app {
    width: 100%;
    max-width: 880px;
    position: relative;
    z-index: 1;
  }

  /* Audio Controls Header */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .audio-btn {
    background: var(--white);
    border: 2px solid var(--cinder);
    border-radius: 20px;
    padding: 6px 14px;
    font-weight: bold;
    color: var(--cinder-dark);
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    transition: transform 0.1s;
  }
  .audio-btn:active { transform: scale(0.95); }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0;
    color: var(--cinder-dark);
    text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
  }
  .subtitle {
    text-align: center;
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 500;
    color: #2b3a28;
  }

  /* ---- PISTA DE OBSTÁCULOS ---- */
  .track-wrap {
    position: relative;
    background: linear-gradient(180deg, #e65c00 0%, #f9d423 100%);
    border-radius: 16px;
    padding: 26px 16px 16px;
    box-shadow: inset 0 0 0 5px var(--lane), 0 12px 28px rgba(0,0,0,0.22);
    overflow: hidden;
    margin-bottom: 20px;
    border: 3px solid var(--cinder-dark);
  }
  .lane-lines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      to right,
      transparent 0,
      transparent 30px,
      rgba(255,255,255,0.4) 30px,
      rgba(255,255,255,0.4) 34px
    );
    top: 50%;
    bottom: 20%;
    pointer-events: none;
  }
  .hurdling-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 18px;
    background: var(--grass);
    border-top: 3px solid var(--grass-dark);
  }

  .hurdles {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    height: 100px;
    padding: 0 10px;
  }
  .hurdle {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    position: relative;
    z-index: 2;
  }
  
  /* Obstáculo gráfico */
  .hurdle .bar {
    width: 22px;
    height: 38px;
    background: repeating-linear-gradient(45deg, #333, #333 6px, #fff 6px, #fff 12px);
    border: 2px solid #222;
    border-radius: 4px 4px 0 0;
    opacity: 0.7;
    transition: all 0.3s;
  }
  .hurdle.done .bar {
    opacity: 1;
    background: repeating-linear-gradient(45deg, #40c057, #40c057 6px, #fff 6px, #fff 12px);
    border-color: var(--grass-dark);
  }
  .hurdle.current .bar {
    opacity: 1;
    animation: hurdlePulse 1s infinite alternate;
  }
  @keyframes hurdlePulse {
    0% { transform: scaleY(1); }
    100% { transform: scaleY(1.15); filter: drop-shadow(0 0 5px #fff); }
  }

  .hurdle-num {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: var(--white);
    background: rgba(0,0,0,0.4);
    padding: 1px 5px;
    border-radius: 8px;
    margin-top: 3px;
  }

  /* Niño corriendo / saltando */
  .runner {
    position: absolute;
    bottom: 16px;
    left: 0;
    width: 48px;
    height: 52px;
    transition: left 0.6s cubic-bezier(.4,1.4,.5,1);
    z-index: 10;
  }
  .runner svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
  }
  
  /* Animación del Salto */
  .runner.jump {
    animation: boyJump 0.75s ease-in-out;
  }
  @keyframes boyJump {
    0% { transform: translateY(0) rotate(0deg); }
    35% { transform: translateY(-50px) rotate(-15deg); }
    65% { transform: translateY(-50px) rotate(10deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  .flag {
    position: absolute;
    right: 8px;
    bottom: 12px;
    font-size: 30px;
    z-index: 2;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 4px 20px;
    font-family: 'Oswald', sans-serif;
  }
  .status-row .pill {
    background: var(--white);
    border-radius: 999px;
    padding: 6px 18px;
    font-size: 15px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    color: var(--cinder-dark);
  }
  .hearts { letter-spacing: 3px; font-size: 18px; }

  /* ---- TARJETA DE PREGUNTAS ---- */
  .card {
    background: var(--white);
    border-radius: 20px;
    padding: 24px 24px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  .card-label {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    color: var(--cinder);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .answer-sentence {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 20px;
    line-height: 1.4;
    color: var(--ink);
    border-left: 5px solid var(--gold);
    padding-left: 14px;
    background: #fff9db;
    padding: 10px 14px;
    border-radius: 0 10px 10px 0;
  }

  .build-zone {
    min-height: 62px;
    border: 2px dashed #b0c4de;
    border-radius: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #f8fafc;
    transition: all 0.2s;
  }
  .build-zone.empty::before {
    content: "Toca las palabras de abajo en el orden correcto";
    color: #94a3b8;
    font-size: 14px;
  }
  .build-zone.wrong {
    border-color: var(--bad);
    background: #fff5f5;
    animation: shake 0.4s;
  }
  .build-zone.right {
    border-color: var(--good);
    background: #ebfbee;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .chip {
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 9px 16px;
    border-radius: 10px;
    cursor: pointer;
    border: none;
    user-select: none;
    transition: all 0.15s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .chip:active { transform: scale(0.93); }

  .placed-chip {
    background: var(--cinder);
    color: var(--white);
  }
  .placed-chip:hover { background: var(--cinder-dark); }

  .bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 20px;
    min-height: 48px;
  }
  .bank-chip {
    background: #e2e8f0;
    color: var(--ink);
  }
  .bank-chip:hover { background: #cbd5e1; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  button.action {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 0.5px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  button.action:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button.action:active { transform: translateY(1px); }
  .btn-check { background: var(--good); color: var(--white); }
  .btn-clear { background: #cbd5e1; color: var(--ink); }

  .feedback {
    font-size: 15px;
    font-weight: 700;
    min-height: 24px;
    margin-top: 12px;
  }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  /* ---- PANTALLA DE CELEBRACIÓN FINAL ---- */
  .finish {
    text-align: center;
    padding: 20px 10px;
  }
  .finish .trophy { font-size: 70px; animation: bounce 1s infinite alternate; }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-15px); }
  }
  .finish h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
    color: #2b8a3e;
    margin: 10px 0 6px;
    text-transform: uppercase;
  }
  .finish h3 {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    color: var(--cinder-dark);
    margin: 0 0 12px;
  }
  .finish p { margin: 0 0 24px; color: #475569; font-size: 16px; }
  
  canvas#confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
  }

  @media (max-width: 560px) {
    .hurdle-num { display:none; }
    .runner { width: 38px; height: 42px; }
    .answer-sentence { font-size: 17px; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="clouds">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
</div>

<div class="app">
  <div class="header-bar">
    <h1>Obstacle Race: WH-Questions</h1>
    <button class="audio-btn" id="audioToggleBtn">🎵 Música: OFF</button>
  </div>
  <p class="subtitle">Ordena las palabras para formar la pregunta en pasado simple y ayuda al niño a saltar los obstáculos.</p>

  <div class="track-wrap">
    <div class="lane-lines"></div>
    <div class="hurdles" id="hurdles"></div>
    <div class="hurdling-ground"></div>
    <span class="flag">🏁</span>
    
    <!-- SVG Animado del niño corriendo/saltando -->
    <div class="runner" id="runner">
      <svg viewBox="0 0 100 120">
        <!-- Cabeza y Cabello -->
        <circle cx="50" cy="25" r="18" fill="#fcc419"/>
        <path d="M 32 20 Q 50 5 68 20 Q 50 12 32 20" fill="#5c3d11"/>
        <circle cx="44" cy="24" r="2.5" fill="#000"/>
        <!-- Sonrisa -->
        <path d="M 42 32 Q 50 38 58 32" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
        <!-- Camiseta -->
        <path d="M 30 45 L 70 45 L 65 75 L 35 75 Z" fill="#d94e2b" id="boyShirt"/>
        <!-- Brazos -->
        <path d="M 30 48 L 15 65" stroke="#fcc419" stroke-width="7" stroke-linecap="round"/>
        <path d="M 70 48 L 85 35" stroke="#fcc419" stroke-width="7" stroke-linecap="round"/>
        <!-- Pantalón corto -->
        <path d="M 35 75 L 65 75 L 68 90 L 32 90 Z" fill="#1c7ed6"/>
        <!-- Piernas -->
        <path d="M 40 90 L 32 112" stroke="#fcc419" stroke-width="7" stroke-linecap="round"/>
        <path d="M 60 90 L 72 108" stroke="#fcc419" stroke-width="7" stroke-linecap="round"/>
        <!-- Zapatos -->
        <ellipse cx="28" cy="114" rx="8" ry="4" fill="#333"/>
        <ellipse cx="76" cy="110" rx="8" ry="4" fill="#333"/>
      </svg>
    </div>
  </div>

  <div class="status-row">
    <span class="pill" id="progressPill">Obstáculo 1 / 12</span>
    <span class="pill hearts" id="hearts">❤️❤️❤️</span>
  </div>

  <div class="card" id="gameCard"></div>
</div>

<script>
const questions = [
  { answer: "I went to Paris last summer.", tokens: ["Where","did","you","go","last","summer"], distractors: ["When","What"] },
  { answer: "She arrived at 8:00 PM.", tokens: ["What","time","did","she","arrive"], distractors: ["Where","Why"] },
  { answer: "He called his best friend.", tokens: ["Who","did","he","call"], distractors: ["What","When"] },
  { answer: "We bought a new car because our old one broke down.", tokens: ["Why","did","you","buy","a","new","car"], distractors: ["What","Who"] },
  { answer: "They ate pizza for dinner.", tokens: ["What","did","they","eat","for","dinner"], distractors: ["Who","Where"] },
  { answer: "I lost my keys at the park.", tokens: ["Where","did","you","lose","your","keys"], distractors: ["What","When"] },
  { answer: "She paid $50 for that dress.", tokens: ["How","much","did","she","pay","for","that","dress"], distractors: ["What","Where"] },
  { answer: "He traveled by plane.", tokens: ["How","did","he","travel"], distractors: ["Where","Who"] },
  { answer: "I met my teacher yesterday.", tokens: ["Who","did","you","meet","yesterday"], distractors: ["When","What"] },
  { answer: "We finished the project last night.", tokens: ["When","did","you","finish","the","project"], distractors: ["What","Why"] },
  { answer: "She studied biology at university.", tokens: ["What","did","she","study","at","university"], distractors: ["Where","Who"] },
  { answer: "They stayed at a hotel near the beach.", tokens: ["Where","did","they","stay"], distractors: ["When","Why"] }
];

let current = 0;
let lives = 3;
let placed = [];
let bank = [];

// Elementos DOM
const hurdlesEl = document.getElementById('hurdles');
const runnerEl = document.getElementById('runner');
const cardEl = document.getElementById('gameCard');
const progressPill = document.getElementById('progressPill');
const heartsEl = document.getElementById('hearts');
const audioBtn = document.getElementById('audioToggleBtn');

/* ======================================================
   SISTEMA DE AUDIO Y MÚSICA DE FONDO (Web Audio API)
====================================================== */
let audioCtx = null;
let isMusicPlaying = false;
let bgmInterval = null;

function initAudio() {
  if(!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(freq, duration, type="sine", timeOffset=0) {
  if(!audioCtx) return;
  setTimeout(() => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }, timeOffset * 1000);
}

function startBGM() {
  initAudio();
  if(isMusicPlaying) return;
  isMusicPlaying = true;
  audioBtn.textContent = "🎵 Música: ON";

  const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
  let step = 0;
  bgmInterval = setInterval(() => {
    if(audioCtx && isMusicPlaying) {
      playNote(notes[step % notes.length], 0.25, "triangle");
      step++;
    }
  }, 350);
}

function stopBGM() {
  isMusicPlaying = false;
  audioBtn.textContent = "🎵 Música: OFF";
  if(bgmInterval) clearInterval(bgmInterval);
}

audioBtn.onclick = () => {
  if(isMusicPlaying) stopBGM();
  else startBGM();
};

function playJumpSound() {
  initAudio();
  if(!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch(e){}
}

function playCelebrationFanfare() {
  stopBGM();
  initAudio();
  const fanfare = [
    {f: 523.25, t: 0, d: 0.2},
    {f: 659.25, t: 0.2, d: 0.2},
    {f: 783.99, t: 0.4, d: 0.2},
    {f: 1046.50, t: 0.6, d: 0.8}
  ];
  fanfare.forEach(n => playNote(n.f, n.d, "square", n.t));
}

/* ======================================================
   LÓGICA DEL JUEGO
====================================================== */
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildHurdles(){
  hurdlesEl.innerHTML = '';
  questions.forEach((_, i) => {
    const h = document.createElement('div');
    h.className = 'hurdle';
    h.id = 'hurdle-' + i;
    h.innerHTML = `<div class="bar"></div><div class="hurdle-num">${i+1}</div>`;
    hurdlesEl.appendChild(h);
  });
}

function updateHurdleStates(){
  questions.forEach((_, i) => {
    const h = document.getElementById('hurdle-' + i);
    if(!h) return;
    h.classList.remove('done', 'current');
    if(i < current) h.classList.add('done');
    if(i === current) h.classList.add('current');
  });
}

function updateRunnerPosition(jump){
  const total = questions.length;
  const pct = (current / total) * 88;
  runnerEl.style.left = `calc(${pct}% + 2px)`;
  
  if(jump){
    playJumpSound();
    runnerEl.classList.remove('jump');
    void runnerEl.offsetWidth; // Forzar reflow de animación
    runnerEl.classList.add('jump');
  }
}

function updateHearts(){
  heartsEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
}

function renderQuestion(){
  if(current >= questions.length){
    renderFinish();
    return;
  }
  const q = questions[current];
  placed = [];
  bank = shuffle([...q.tokens, ...q.distractors]);

  progressPill.textContent = `Obstáculo ${current + 1} / ${questions.length}`;
  updateHurdleStates();
  updateRunnerPosition(false);
  updateHearts();

  cardEl.innerHTML = `
    <div class="card-label">Pregunta para la respuesta:</div>
    <p class="answer-sentence">"${q.answer}"</p>
    <div class="build-zone empty" id="buildZone"></div>
    <div class="bank" id="bank"></div>
    <div class="controls">
      <button class="action btn-clear" id="clearBtn">Borrar</button>
      <button class="action btn-check" id="checkBtn">Saltar obstáculo ▶</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  renderBank();
  renderBuildZone();

  document.getElementById('clearBtn').onclick = () => {
    placed = [];
    bank = shuffle([...q.tokens, ...q.distractors]);
    renderBank();
    renderBuildZone();
    document.getElementById('feedback').textContent = '';
  };

  document.getElementById('checkBtn').onclick = () => checkAnswer(q);
}

function renderBank(){
  const bankEl = document.getElementById('bank');
  bankEl.innerHTML = '';
  bank.forEach((word, idx) => {
    const btn = document.createElement('button');
    btn.className = 'chip bank-chip';
    btn.textContent = word;
    btn.onclick = () => {
      initAudio();
      placed.push(word);
      bank.splice(idx, 1);
      renderBank();
      renderBuildZone();
      document.getElementById('feedback').textContent = '';
      document.getElementById('buildZone').classList.remove('wrong','right');
    };
    bankEl.appendChild(btn);
  });
}

function renderBuildZone(){
  const zone = document.getElementById('buildZone');
  zone.innerHTML = '';
  zone.classList.toggle('empty', placed.length === 0);
  placed.forEach((word, idx) => {
    const btn = document.createElement('button');
    btn.className = 'chip placed-chip';
    btn.textContent = word;
    btn.onclick = () => {
      bank.push(word);
      placed.splice(idx, 1);
      renderBank();
      renderBuildZone();
    };
    zone.appendChild(btn);
  });
}

function checkAnswer(q){
  const feedback = document.getElementById('feedback');
  const zone = document.getElementById('buildZone');
  const given = placed.map(w => w.toLowerCase());
  const target = q.tokens.map(w => w.toLowerCase());
  const isCorrect = given.length === target.length && given.every((w, i) => w === target[i]);

  if(isCorrect){
    zone.classList.remove('wrong');
    zone.classList.add('right');
    feedback.textContent = '¡Excelente! ¡Obstáculo superado! 🎉';
    feedback.className = 'feedback good';
    current++;
    updateRunnerPosition(true);
    setTimeout(renderQuestion, 800);
  }else{
    zone.classList.remove('right');
    zone.classList.add('wrong');
    lives = Math.max(0, lives - 1);
    updateHearts();
    feedback.textContent = lives > 0
      ? '¡Tropezaste con el obstáculo! Revisa el orden de las palabras.'
      : 'Sin vidas por ahora, pero intenta ajustar el orden para avanzar.';
    feedback.className = 'feedback bad';
    if(lives === 0){ lives = 3; }
  }
}

/* ======================================================
   EFECTO DE CONFETI Y PANTALLA FINAL
====================================================== */
function triggerConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = [];
  const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];

  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      size: Math.random() * 10 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 5 + 2,
      rotation: Math.random() * 360
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI / 180);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();

      p.y += p.speed;
      p.rotation += 2;
      if (p.y > canvas.height) p.y = -20;
    });
    requestAnimationFrame(draw);
  }
  draw();
}

function renderFinish(){
  updateHurdleStates();
  playCelebrationFanfare();
  triggerConfetti();

  document.getElementById('progressPill').textContent = `Obstáculo ${questions.length} / ${questions.length}`;
  cardEl.innerHTML = `
    <div class="finish">
      <div class="trophy">🏆</div>
      <h2>CONGRATULATIONS!</h2>
      <h3>¡Felicidades! Has completado la pista</h3>
      <p>Dominaste la estructura de las preguntas WH en pasado simple.</p>
      <button class="action btn-check" id="restartBtn">Correr de Nuevo 🔄</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = () => {
    location.reload();
  };
}

buildHurdles();
renderQuestion();
</script>
