<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape del Castillo: Past Continuous</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;700;800&display=swap');

  :root{
    --night: #1b1830;
    --night-deep: #100e1f;
    --purple: #3c2a63;
    --purple-light: #5a3f8f;
    --gold: #e8b64c;
    --gold-dark: #b8862a;
    --parchment: #f2e8d0;
    --ember: #8a2b3a;
    --ok: #4a9d6e;
    --ink: #241f38;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    color: var(--parchment);
    background: var(--night-deep);
    padding: 30px 14px 70px;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  .app{ width: 100%; max-width: 760px; position: relative; z-index: 2; }

  /* ---------- animated castle backdrop ---------- */
  .bg-scene{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 0%, rgba(90,63,143,0.55), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(232,182,76,0.10), transparent 40%),
      linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
  }

  .moon{
    position: absolute;
    top: 8%; right: 12%;
    width: 92px; height: 92px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e0, var(--gold) 70%, var(--gold-dark) 100%);
    box-shadow: 0 0 40px 14px rgba(232,182,76,0.35), 0 0 90px 30px rgba(232,182,76,0.12);
    animation: moonGlow 6s ease-in-out infinite;
  }
  @keyframes moonGlow{
    0%,100%{ box-shadow: 0 0 40px 14px rgba(232,182,76,0.30), 0 0 90px 30px rgba(232,182,76,0.10); }
    50%{ box-shadow: 0 0 52px 20px rgba(232,182,76,0.45), 0 0 110px 40px rgba(232,182,76,0.18); }
  }

  .stars{ position: absolute; inset: 0; }
  .star{
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity: 0.15; }
    50%{ opacity: 1; }
  }

  .fog{
    position: absolute;
    left: -20%;
    width: 140%;
    height: 160px;
    background: linear-gradient(90deg, transparent, rgba(220,215,240,0.10), transparent);
    filter: blur(6px);
    opacity: 0.5;
  }
  .fog-1{ bottom: 60px; animation: driftRight 38s linear infinite; }
  .fog-2{ bottom: 20px; height: 110px; opacity: 0.35; animation: driftLeft 52s linear infinite; }
  @keyframes driftRight{
    0%{ transform: translateX(-10%); }
    100%{ transform: translateX(10%); }
  }
  @keyframes driftLeft{
    0%{ transform: translateX(10%); }
    100%{ transform: translateX(-10%); }
  }

  .castle-silhouette{
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    height: auto;
    opacity: 0.9;
  }

  .torch{
    position: absolute;
    bottom: 78px;
    width: 10px; height: 26px;
    border-radius: 3px 3px 1px 1px;
  }
  .torch::before{
    content: "";
    position: absolute;
    top: -20px; left: 50%;
    transform: translateX(-50%);
    width: 16px; height: 24px;
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    background: radial-gradient(circle at 50% 30%, #fff3c4, var(--gold) 45%, var(--ember) 85%);
    box-shadow: 0 0 16px 6px rgba(232,182,76,0.55);
    animation: flicker 1.8s ease-in-out infinite;
  }
  .torch-left{ left: 14%; }
  .torch-right{ right: 14%; }
  .torch-left::before{ animation-delay: 0.3s; }
  @keyframes flicker{
    0%,100%{ transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 1; }
    20%{ transform: translateX(-50%) scale(0.92,1.05) rotate(2deg); opacity: 0.85; }
    45%{ transform: translateX(-50%) scale(1.06,0.94) rotate(-2deg); opacity: 1; }
    70%{ transform: translateX(-50%) scale(0.96,1.02) rotate(1deg); opacity: 0.9; }
  }

  .bat{
    position: absolute;
    font-size: 16px;
    opacity: 0.8;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .bat-1{ top: 18%; animation-name: flyRight; animation-duration: 22s; }
  .bat-2{ top: 30%; animation-name: flyLeft; animation-duration: 27s; animation-delay: 4s; font-size: 12px; }
  .bat-3{ top: 12%; animation-name: flyRight; animation-duration: 33s; animation-delay: 12s; font-size: 13px; }
  @keyframes flyRight{
    0%{ left: -5%; transform: translateY(0); }
    50%{ transform: translateY(18px); }
    100%{ left: 105%; transform: translateY(0); }
  }
  @keyframes flyLeft{
    0%{ left: 105%; transform: translateY(0); }
    50%{ transform: translateY(-14px); }
    100%{ left: -5%; transform: translateY(0); }
  }

  /* sound toggle */
  .sound-toggle{
    position: fixed;
    top: 14px; right: 14px;
    z-index: 5;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--gold-dark);
    background: var(--ink);
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transition: transform 0.15s, background 0.2s;
  }
  .sound-toggle:hover{ transform: scale(1.06); }
  .sound-toggle.on{ background: var(--purple); box-shadow: 0 0 14px rgba(232,182,76,0.5); }

  @media (prefers-reduced-motion: reduce){
    .moon, .star, .fog-1, .fog-2, .torch::before, .bat-1, .bat-2, .bat-3{ animation: none !important; }
  }

  h1{
    font-family: 'Cinzel', serif;
    font-size: clamp(26px, 5vw, 38px);
    text-align: center;
    color: var(--gold);
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(232,182,76,0.25);
  }
  .subtitle{
    text-align: center;
    margin: 0 0 24px;
    color: #cfc6e8;
    font-size: 15px;
  }

  /* padlock chain progress */
  .chain{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .lock-icon{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--ink);
    border: 2px solid var(--purple-light);
    transition: all 0.3s;
  }
  .lock-icon.open{
    background: var(--gold);
    border-color: var(--gold-dark);
    box-shadow: 0 0 14px rgba(232,182,76,0.6);
  }

  /* code strip */
  .code-strip{
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .code-digit{
    width: 34px;
    height: 42px;
    border-radius: 6px;
    background: var(--ink);
    border: 2px solid var(--purple-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: #5a5480;
  }
  .code-digit.filled{
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(232,182,76,0.08);
  }

  /* puzzle card */
  .room-card{
    background: linear-gradient(180deg, #2a2348, #201a3a);
    border: 1px solid var(--purple-light);
    border-radius: 16px;
    padding: 24px 22px 22px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.45);
  }
  .room-label{
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .scene{
    font-size: 16px;
    line-height: 1.55;
    color: var(--parchment);
    margin: 0 0 8px;
  }
  .scene b{ color: var(--gold); }
  .hint{
    font-size: 13px;
    color: #b6ade0;
    margin: 0 0 18px;
  }

  .build-zone{
    min-height: 56px;
    border: 2px dashed #5a4f86;
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 8px;
    transition: border-color 0.2s, background 0.2s;
  }
  .build-zone.empty::before{
    content: "Toca las palabras en orden para formar la oración";
    color: #857bb0;
    font-size: 13px;
  }
  .build-zone.wrong{ border-color: var(--ember); background: rgba(138,43,58,0.15); animation: shake 0.4s; }
  .build-zone.right{ border-color: var(--ok); background: rgba(74,157,110,0.12); }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  .chip{
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    user-select: none;
    transition: transform 0.12s;
  }
  .chip:active{ transform: scale(0.94); }
  .placed-chip{ background: var(--gold); color: var(--ink); }
  .placed-chip:hover{ background: #f2c869; }

  .bank{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px 0 20px;
    min-height: 40px;
  }
  .bank-chip{ background: var(--purple); color: var(--parchment); }
  .bank-chip:hover{ background: var(--purple-light); }
  .bank-chip:disabled{ opacity: 0; pointer-events: none; }

  .controls{ display: flex; gap: 10px; justify-content: flex-end; }
  button.action{
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.4px;
    padding: 11px 18px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    transition: transform 0.12s, filter 0.12s;
  }
  button.action:hover{ filter: brightness(1.08); }
  button.action:active{ transform: scale(0.97); }
  .btn-check{ background: var(--ok); color: #fff; }
  .btn-clear{ background: #453a6e; color: var(--parchment); }

  .feedback{ font-size: 14px; font-weight: 800; min-height: 20px; margin-top: 10px; }
  .feedback.good{ color: #8fe0ae; }
  .feedback.bad{ color: #e88f96; }

  .finish{ text-align: center; padding: 24px 10px; }
  .finish h2{ font-family: 'Cinzel', serif; color: var(--gold); margin: 8px 0 4px; }
  .finish p{ color: #cfc6e8; margin: 0 0 20px; }
  .btn-restart{ background: var(--gold); color: var(--ink); }

  .door-scene{
    width: 300px;
    height: 250px;
    margin: 4px auto 14px;
    position: relative;
  }
  .door-frame{
    position: absolute;
    inset: 0;
    border-radius: 130px 130px 10px 10px;
    background: linear-gradient(180deg, #1a1430, #0c081a);
    border: 5px solid var(--gold-dark);
    box-shadow: 0 0 46px rgba(232,182,76,0.3), inset 0 0 28px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .door-glow{
    position: absolute;
    inset: 10px;
    border-radius: 120px 120px 6px 6px;
    background: radial-gradient(circle at 50% 40%, #fff2c2, #e8b64c 45%, #6a4a12 100%);
    opacity: 0;
    animation: glowIn 1.8s ease-out forwards;
    animation-delay: 0.4s;
  }
  .door-panel{
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background: linear-gradient(180deg, #4a3a7a, #2c2050);
    border: 2px solid var(--gold-dark);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    transform-origin: center;
  }
  .door-panel::before{
    content: "";
    position: absolute;
    top: 14%; bottom: 14%; left: 50%;
    width: 3px;
    background: rgba(232,182,76,0.5);
    transform: translateX(-50%);
  }
  .door-left{
    left: 0;
    border-radius: 130px 0 0 10px;
    transform-origin: left center;
    animation: openLeft 1.4s ease-in forwards;
    animation-delay: 0.5s;
  }
  .door-right{
    right: 0;
    border-radius: 0 130px 10px 0;
    transform-origin: right center;
    animation: openRight 1.4s ease-in forwards;
    animation-delay: 0.5s;
  }
  @keyframes openLeft{
    0%{ transform: perspective(400px) rotateY(0deg); }
    100%{ transform: perspective(400px) rotateY(-92deg); opacity: 0.5; }
  }
  @keyframes openRight{
    0%{ transform: perspective(400px) rotateY(0deg); }
    100%{ transform: perspective(400px) rotateY(92deg); opacity: 0.5; }
  }
  @keyframes glowIn{
    0%{ opacity: 0; }
    100%{ opacity: 1; }
  }
  .door-figure{
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%) scale(0.5);
    font-size: 46px;
    opacity: 0;
    animation: stepOut 1.6s ease-out forwards;
    animation-delay: 1.1s;
  }
  @keyframes stepOut{
    0%{ opacity: 0; transform: translateX(-50%) scale(0.5) translateY(10px); }
    100%{ opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  }
  .finish-en{
    font-family: 'Cinzel', serif;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 700;
    color: var(--gold);
    margin: 4px 0 2px;
    text-shadow: 0 2px 10px rgba(232,182,76,0.35);
    animation: titlePulse 1.6s ease-in-out infinite;
    animation-delay: 1.6s;
  }
  @keyframes titlePulse{
    0%,100%{ text-shadow: 0 2px 10px rgba(232,182,76,0.35); transform: scale(1); }
    50%{ text-shadow: 0 2px 26px rgba(232,182,76,0.8); transform: scale(1.03); }
  }

  /* ---------- toast messages for lock feedback ---------- */
  .toast-layer{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
  }
  .toast{
    position: absolute;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 12px;
    text-align: center;
    white-space: nowrap;
  }
  .toast-success{
    background: linear-gradient(135deg, #f2c869, #b8862a);
    color: var(--ink);
    box-shadow: 0 0 44px rgba(232,182,76,0.65);
    font-size: clamp(18px, 4.5vw, 28px);
    animation: toastPop 1.5s ease forwards;
  }
  .toast-error{
    background: rgba(138,43,58,0.96);
    color: #fff2f2;
    border: 2px solid #ff6b7a;
    box-shadow: 0 0 32px rgba(138,43,58,0.75);
    font-size: clamp(16px, 3.8vw, 22px);
    animation: toastShake 1.5s ease forwards;
  }
  @keyframes toastPop{
    0%{ opacity: 0; transform: scale(0.4) rotate(-8deg); }
    15%{ opacity: 1; transform: scale(1.15) rotate(3deg); }
    30%{ transform: scale(1) rotate(0deg); }
    78%{ opacity: 1; transform: scale(1) rotate(0deg); }
    100%{ opacity: 0; transform: scale(0.92) translateY(-24px); }
  }
  @keyframes toastShake{
    0%{ opacity: 0; transform: translateX(0) scale(0.9); }
    8%{ opacity: 1; transform: translateX(-10px) scale(1); }
    18%{ transform: translateX(10px); }
    28%{ transform: translateX(-8px); }
    38%{ transform: translateX(8px); }
    48%{ transform: translateX(-4px); }
    58%{ transform: translateX(0); }
    85%{ opacity: 1; }
    100%{ opacity: 0; transform: translateY(-14px); }
  }

  /* ---------- confetti ---------- */
  .confetti-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 60;
  }
  .confetti-piece{
    position: absolute;
    top: -24px;
    opacity: 0.95;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(112vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 480px){
    .scene{ font-size: 15px; }
    .lock-icon{ width: 32px; height: 32px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="bg-scene" aria-hidden="true">
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="bat bat-1">🦇</div>
  <div class="bat bat-2">🦇</div>
  <div class="bat bat-3">🦇</div>
  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>
  <div class="torch torch-left"></div>
  <div class="torch torch-right"></div>
  <svg class="castle-silhouette" viewBox="0 0 800 140" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#0c0a18" d="M0,140 L0,80 L20,80 L20,60 L35,60 L35,80 L55,80 L55,40 L65,25 L75,40 L75,80 L110,80 L110,95 L140,95 L140,50 L155,50 L155,35 L165,35 L165,50 L180,50 L180,95 L230,95 L230,70 L245,70 L245,55 L255,55 L255,70 L270,70 L270,95 L340,95 L340,60 L355,60 L355,20 L365,5 L375,20 L375,60 L390,60 L390,95 L460,95 L460,70 L475,70 L475,55 L485,55 L485,70 L500,70 L500,95 L560,95 L560,50 L575,50 L575,35 L585,35 L585,50 L600,50 L600,95 L650,95 L650,80 L665,80 L665,40 L675,25 L685,40 L685,80 L705,80 L705,60 L720,60 L720,80 L740,80 L740,140 Z"/>
  </svg>
</div>

<button class="sound-toggle" id="soundToggle" title="Activar ambiente sonoro">🔇</button>

<div class="toast-layer" id="toastLayer" aria-hidden="true"></div>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<div class="app">
  <h1>El Escape del Castillo</h1>
  <p class="subtitle">Resuelve cada candado formando la oración en past continuous. Cada acierto revela un número del código de salida.</p>

  <div class="chain" id="chain"></div>
  <div class="code-strip" id="codeStrip"></div>

  <div class="room-card" id="roomCard"></div>
</div>

<script>
/* ---------- starfield ---------- */
function buildStars(){
  const container = document.getElementById('stars');
  const count = window.innerWidth < 480 ? 40 : 70;
  let html = '';
  for(let i = 0; i < count; i++){
    const size = (Math.random() * 2 + 1).toFixed(1);
    const top = (Math.random() * 65).toFixed(1);
    const left = (Math.random() * 100).toFixed(1);
    const dur = (Math.random() * 3 + 2).toFixed(1);
    const delay = (Math.random() * 4).toFixed(1);
    html += `<div class="star" style="width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
  }
  container.innerHTML = html;
}

/* ---------- ambient castle sound engine (synthesized, no audio files) ---------- */
const CastleSound = (() => {
  let ctx = null;
  let master = null;
  let ambientGain = null;
  let running = false;
  let creakTimer = null;
  let motifTimer = null;
  let motifIndex = 0;
  const motifNotes = [220.00, 261.63, 220.00, 196.00, 174.61, 196.00, 220.00, 246.94]; // suspenseful A-minor-ish motif

  function makeNoiseBuffer(){
    const bufferSize = ctx.sampleRate * 4;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for(let i = 0; i < bufferSize; i++){
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.5;
    }
    return buffer;
  }

  function startWind(){
    const noise = ctx.createBufferSource();
    noise.buffer = makeNoiseBuffer();
    noise.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 420;

    const windGain = ctx.createGain();
    windGain.gain.value = 0.05;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.045;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.035;
    lfo.connect(lfoGain);
    lfoGain.connect(windGain.gain);
    lfo.start();

    noise.connect(filter);
    filter.connect(windGain);
    windGain.connect(ambientGain);
    noise.start();
  }

  function startDrone(){
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.022;
    [55, 55.6].forEach((freq) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(droneGain);
      osc.start();
    });
    droneGain.connect(ambientGain);
  }

  function playMotifNote(freq){
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.05, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(filter);
    filter.connect(g);
    g.connect(ambientGain);
    osc.start(now);
    osc.stop(now + 0.32);
  }

  function scheduleMotif(){
    motifTimer = setInterval(() => {
      playMotifNote(motifNotes[motifIndex % motifNotes.length]);
      motifIndex++;
    }, 360);
  }

  function playCreak(){
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140 + Math.random() * 60, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 1.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.03, now + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 300;
    osc.connect(filter);
    filter.connect(g);
    g.connect(ambientGain);
    osc.start(now);
    osc.stop(now + 1.3);
  }

  function scheduleCreaks(){
    const next = 7000 + Math.random() * 11000;
    creakTimer = setTimeout(() => {
      if(running) playCreak();
      scheduleCreaks();
    }, next);
  }

  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      ambientGain = ctx.createGain();
      ambientGain.gain.value = 0;
      ambientGain.connect(master);
      startWind();
      startDrone();
    }
    if(ctx.state === 'suspended') ctx.resume();
  }

  return {
    toggle(){
      ensureCtx();
      running = !running;
      const now = ctx.currentTime;
      ambientGain.gain.cancelScheduledValues(now);
      ambientGain.gain.setValueAtTime(ambientGain.gain.value, now);
      ambientGain.gain.linearRampToValueAtTime(running ? 0.9 : 0, now + 0.8);
      if(running){
        scheduleCreaks();
        scheduleMotif();
      } else {
        clearTimeout(creakTimer);
        clearInterval(motifTimer);
      }
      return running;
    },
    chime(){
      ensureCtx();
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const g = ctx.createGain();
        const start = now + i * 0.09;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(0.09, start + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);
        osc.connect(g);
        g.connect(master);
        osc.start(start);
        osc.stop(start + 0.65);
      });
    },
    buzz(){
      ensureCtx();
      const now = ctx.currentTime;
      [110, 116.5].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.linearRampToValueAtTime(freq * 0.85, now + 0.35);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.08, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 600;
        osc.connect(filter);
        filter.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 0.42);
      });
    },
    victoryFanfare(){
      ensureCtx();
      const now = ctx.currentTime;
      const delay = ctx.createDelay();
      delay.delayTime.value = 0.22;
      const feedback = ctx.createGain();
      feedback.gain.value = 0.22;
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(master);

      const sequence = [
        [523.25, 0.00, 0.30], [659.25, 0.15, 0.30], [783.99, 0.30, 0.30],
        [1046.50, 0.45, 0.55], [880.00, 0.75, 0.20], [1046.50, 0.95, 0.20],
        [1318.51, 1.15, 0.75]
      ];
      sequence.forEach(([freq, offset, dur]) => {
        const start = now + offset;
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(0.09, start + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(g);
        g.connect(master);
        g.connect(delay);
        osc.start(start);
        osc.stop(start + dur + 0.05);
      });
    }
  };
})();

/* ---------- toast messages ---------- */
function showToast(message, type){
  const layer = document.getElementById('toastLayer');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = message;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

/* ---------- confetti burst ---------- */
function launchConfetti(){
  const layer = document.getElementById('confettiLayer');
  const colors = ['#e8b64c', '#5a3f8f', '#8a2b3a', '#4a9d6e', '#f2e8d0', '#b8862a'];
  const count = 110;
  for(let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100).toFixed(2) + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const w = (Math.random() * 5 + 5).toFixed(1);
    const h = (Math.random() * 10 + 8).toFixed(1);
    piece.style.width = w + 'px';
    piece.style.height = h + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const dur = (Math.random() * 1.8 + 1.8).toFixed(2);
    const delay = (Math.random() * 0.7).toFixed(2);
    piece.style.animationDuration = dur + 's';
    piece.style.animationDelay = delay + 's';
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), (parseFloat(dur) + parseFloat(delay)) * 1000 + 300);
  }
}

const rooms = [
  {
    scene: 'Entras al pasillo oscuro del castillo. Algo se mueve entre las sombras...',
    prompt: '(you / explore) the dark hallway when you heard a noise.',
    tokens: ["You","were","exploring","the","dark","hallway"],
    distractors: ["explored","was"],
    digit: 7
  },
  {
    scene: 'Una puerta cruje. Un fantasma aparece frente a ti.',
    prompt: 'The ghost (open) the door at midnight.',
    tokens: ["The","ghost","was","opening","the","door","at","midnight"],
    distractors: ["were","opens"],
    digit: 3
  },
  {
    scene: 'Tus amigos están muy asustados y no reaccionan.',
    prompt: 'We (not / listen) carefully.',
    tokens: ["We","were","not","listening","carefully"],
    distractors: ["didn't","listen"],
    digit: 9
  },
  {
    scene: 'Un gato negro te observa desde una ventana rota.',
    prompt: 'The cat (watch) us from the window.',
    tokens: ["The","cat","was","watching","us","from","the","window"],
    distractors: ["were","watched"],
    digit: 1
  },
  {
    scene: 'En el salón principal, un piano viejo suena solo.',
    prompt: 'They (play) a strange melody on the old piano.',
    tokens: ["They","were","playing","a","strange","melody","on","the","old","piano"],
    distractors: ["was","played"],
    digit: 5
  },
  {
    scene: 'El reloj del castillo empieza a sonar. ¡Es hora de escapar!',
    prompt: 'I (hide) behind the curtain when the clock struck twelve.',
    tokens: ["I","was","hiding","behind","the","curtain"],
    distractors: ["were","hid"],
    digit: 2
  }
];

let current = 0;
let placed = [];
let bank = [];
const code = [];

const chainEl = document.getElementById('chain');
const codeStripEl = document.getElementById('codeStrip');
const roomCardEl = document.getElementById('roomCard');

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChainAndCode(){
  chainEl.innerHTML = '';
  codeStripEl.innerHTML = '';
  rooms.forEach((_, i) => {
    const lock = document.createElement('div');
    lock.className = 'lock-icon';
    lock.id = 'lock-' + i;
    lock.textContent = '🔒';
    chainEl.appendChild(lock);

    const digitBox = document.createElement('div');
    digitBox.className = 'code-digit';
    digitBox.id = 'digit-' + i;
    digitBox.textContent = '?';
    codeStripEl.appendChild(digitBox);
  });
}

function renderRoom(){
  if(current >= rooms.length){
    renderFinish();
    return;
  }
  const r = rooms[current];
  placed = [];
  bank = shuffle([...r.tokens, ...r.distractors]);

  roomCardEl.innerHTML = `
    <div class="room-label">🕯️ Candado ${current + 1} de ${rooms.length}</div>
    <p class="scene">${r.scene}</p>
    <p class="hint">Forma la oración: <b>${r.prompt}</b></p>
    <div class="build-zone empty" id="buildZone"></div>
    <div class="bank" id="bank"></div>
    <div class="controls">
      <button class="action btn-clear" id="clearBtn">Reiniciar</button>
      <button class="action btn-check" id="checkBtn">Abrir candado 🔓</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;

  renderBank();
  renderBuildZone();

  document.getElementById('clearBtn').onclick = () => {
    placed = [];
    bank = shuffle([...r.tokens, ...r.distractors]);
    renderBank();
    renderBuildZone();
    document.getElementById('feedback').textContent = '';
    document.getElementById('buildZone').classList.remove('wrong','right');
  };

  document.getElementById('checkBtn').onclick = () => checkAnswer(r);
}

function renderBank(){
  const bankEl = document.getElementById('bank');
  bankEl.innerHTML = '';
  bank.forEach((word, idx) => {
    const btn = document.createElement('button');
    btn.className = 'chip bank-chip';
    btn.textContent = word;
    btn.onclick = () => {
      placed.push(word);
      bank.splice(idx, 1);
      renderBank();
      renderBuildZone();
      document.getElementById('feedback').textContent = '';
      document.getElementById('buildZone').classList.remove('wrong','right');
    };
    bankEl.appendChild(btn);
  });
}

function renderBuildZone(){
  const zone = document.getElementById('buildZone');
  zone.innerHTML = '';
  zone.classList.toggle('empty', placed.length === 0);
  placed.forEach((word, idx) => {
    const btn = document.createElement('button');
    btn.className = 'chip placed-chip';
    btn.textContent = word;
    btn.onclick = () => {
      bank.push(word);
      placed.splice(idx, 1);
      renderBank();
      renderBuildZone();
    };
    zone.appendChild(btn);
  });
}

function checkAnswer(r){
  const feedback = document.getElementById('feedback');
  const zone = document.getElementById('buildZone');
  const given = placed.map(w => w.toLowerCase());
  const target = r.tokens.map(w => w.toLowerCase());
  const isCorrect = given.length === target.length && given.every((w, i) => w === target[i]);

  if(isCorrect){
    zone.classList.remove('wrong');
    zone.classList.add('right');
    feedback.textContent = `Secret code: ${r.digit} 🔑`;
    feedback.className = 'feedback good';
    CastleSound.chime();
    showToast('🔓 LOCK OPENED!', 'success');

    document.getElementById('lock-' + current).classList.add('open');
    document.getElementById('lock-' + current).textContent = '🔓';
    document.getElementById('digit-' + current).textContent = r.digit;
    document.getElementById('digit-' + current).classList.add('filled');
    code.push(r.digit);

    current++;
    setTimeout(renderRoom, 900);
  }else{
    zone.classList.remove('right');
    zone.classList.add('wrong');
    feedback.textContent = '';
    feedback.className = 'feedback bad';
    CastleSound.buzz();
    showToast('❌ INCORRECT! TRY AGAIN', 'error');
  }
}

function renderFinish(){
  roomCardEl.innerHTML = `
    <div class="finish">
      <div class="door-scene">
        <div class="door-frame">
          <div class="door-glow"></div>
          <div class="door-panel door-left"></div>
          <div class="door-panel door-right"></div>
        </div>
        <div class="door-figure">🧙</div>
      </div>
      <p class="finish-en">Congratulations, you have opened the castle!</p>
      <h2>¡Escapaste del castillo!</h2>
      <p>Código secreto completo: <b style="color:var(--gold)">${code.join(' - ')}</b><br>Formaste las 6 oraciones en past continuous correctamente.</p>
      <button class="action btn-restart" id="restartBtn">Jugar de nuevo</button>
    </div>
  `;
  CastleSound.victoryFanfare();
  launchConfetti();
  document.getElementById('restartBtn').onclick = () => {
    current = 0;
    code.length = 0;
    buildChainAndCode();
    renderRoom();
  };
}

buildStars();
buildChainAndCode();
renderRoom();

const soundBtn = document.getElementById('soundToggle');
soundBtn.addEventListener('click', () => {
  const isOn = CastleSound.toggle();
  soundBtn.textContent = isOn ? '🔊' : '🔇';
  soundBtn.classList.toggle('on', isOn);
  soundBtn.title = isOn ? 'Silenciar ambiente' : 'Activar ambiente sonoro';
});
</script>
